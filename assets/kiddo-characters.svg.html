<!-- Cartoon symbols (original hand-drawn-style drawings) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- wobbly pencil line -->
    <filter id="sketch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketch2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- pencil hatching for shading -->
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3b2a1c" stroke-width="1.1" opacity=".28"/>
    </pattern>

    <!-- ===== Bunny ===== -->
    <symbol id="bunny" viewBox="0 0 140 185">

        <path d="M80 78 C 82 46, 96 12, 111 18 C 124 26, 106 58, 95 82Z" fill="#fff"/>
        <path d="M70 64 C 106 62, 124 86, 119 110 C 114 134, 92 142, 70 142 C 46 142, 24 134, 21 110 C 18 86, 36 64, 70 64Z" fill="#fff"/>

      </g>
      <path d="M44 156 C 46 172, 56 178, 70 178 C 84 178, 94 172, 96 156Z" fill="url(#hatch)"/>
      <path d="M47 20 C 44 36, 48 56, 54 70" stroke="#f3a5b0" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#sketch2)"/>
      <path d="M104 24 C 98 40, 92 58, 88 72" stroke="#f3a5b0" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#sketch2)"/>
      <!-- pencil outline, drawn twice -->
      <g fill="none" stroke="var(--line,#3b2a1c)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch)">
        <path d="M48 80 C 32 52, 28 18, 43 10 C 58 4, 66 42, 63 78"/>
        <path d="M80 78 C 82 46, 96 12, 111 18 C 124 26, 106 58, 95 82"/>
        <path d="M70 64 C 106 62, 124 86, 119 110 C 114 134, 92 142, 70 142 C 46 142, 24 134, 21 110 C 18 86, 36 64, 70 64Z"/>
        <path d="M44 138 C 38 162, 48 180, 70 180 C 92 180, 102 162, 96 138"/>
        <path d="M40 150 c -8 2 -10 10 -4 13"/><path d="M100 150 c 8 2 10 10 4 13"/>
      </g>
      <g fill="none" stroke="var(--line,#3b2a1c)" stroke-width="1.2" opacity=".45" stroke-linecap="round" filter="url(#sketch2)">
        <path d="M71 62 C 108 61, 126 88, 121 111 C 115 136, 92 144, 69 143"/>
        <path d="M46 78 C 31 50, 29 20, 45 12"/>
      </g>
      <!-- face -->
      <ellipse cx="52" cy="104" rx="5.5" ry="7.5" fill="#2a1e13"/><circle cx="54.5" cy="100.5" r="2.2" fill="#fff"/><circle cx="50.5" cy="107" r="1" fill="#fff"/>
      <ellipse cx="88" cy="104" rx="5.5" ry="7.5" fill="#2a1e13"/><circle cx="90.5" cy="100.5" r="2.2" fill="#fff"/><circle cx="86.5" cy="107" r="1" fill="#fff"/>
      <ellipse cx="40" cy="120" rx="8" ry="4.5" fill="#f7a1a1" opacity=".75"/>
      <ellipse cx="100" cy="120" rx="8" ry="4.5" fill="#f7a1a1" opacity=".75"/>
      <path d="M67 113 l3 2.5 l3 -2.5" fill="#f08c9a" stroke="#2a1e13" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M64 120 q3 4 6 0 q3 4 6 0" fill="none" stroke="#2a1e13" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>

      </g>
      <g fill="none" stroke="var(--line,#3b2a1c)" stroke-width="1.2" opacity=".45" stroke-linecap="round" filter="url(#sketch2)">

      </g>
      <ellipse cx="60" cy="94" rx="6.5" ry="8.5" fill="#2a1e13"/><circle cx="63" cy="90" r="2.6" fill="#fff"/><circle cx="58" cy="98" r="1.1" fill="#fff"/>
      <ellipse cx="92" cy="94" rx="6.5" ry="8.5" fill="#2a1e13"/><circle cx="95" cy="90" r="2.6" fill="#fff"/><circle cx="90" cy="98" r="1.1" fill="#fff"/>
      <circle cx="44" cy="112" r="8.5" fill="#ee5a4f" opacity=".9" filter="url(#sketch2)"/>
      <circle cx="108" cy="112" r="8.5" fill="#ee5a4f" opacity=".9" filter="url(#sketch2)"/>
      <circle cx="76" cy="105" r="1.6" fill="#2a1e13"/>
      <path d="M69 110 q3.5 5 7 0 q3.5 5 7 0" fill="none" stroke="#2a1e13" stroke-width="1.8" stroke-linecap="round"/>

      <!-- happy face on screen -->
      <path d="M48 62 q 7 -9 14 0" fill="none" stroke="#8ff0b4" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M72 62 q 7 -9 14 0" fill="none" stroke="#8ff0b4" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M58 72 q 9 7 18 0" fill="none" stroke="#8ff0b4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="66" cy="124" r="9" fill="#f6cf45" stroke="var(--line,#3b2a1c)" stroke-width="2.4" filter="url(#sketch)"/>
    </symbol>

    <!-- ===== Books ===== -->
    <symbol id="books" viewBox="0 0 160 124">
      <g transform="translate(2,2)" filter="url(#sketch2)">
        <rect x="10" y="88" width="140" height="26" rx="4" fill="#ee6a4f"/>
        <rect x="22" y="60" width="118" height="26" rx="4" fill="#86b86a"/>
        <rect x="14" y="32" width="126" height="26" rx="4" fill="#7aa7dc"/>
        <rect x="30" y="6" width="100" height="24" rx="4" fill="#f6cf45"/>

    <!-- ===== Picture ===== -->
    <symbol id="pic" viewBox="0 0 100 80">
      <rect x="6" y="6" width="90" height="70" rx="5" fill="#fffaf0" filter="url(#sketch2)"/>
      <circle cx="72" cy="24" r="9" fill="#f6cf45" filter="url(#sketch2)"/>
      <path d="M12 68 L38 32 L58 58 L68 46 L88 68Z" fill="#86b86a" filter="url(#sketch2)"/>
      <g fill="none" stroke="var(--line,#3b2a1c)" stroke-width="2.2" stroke-linejoin="round" filter="url(#sketch)">
        <rect x="4" y="4" width="92" height="72" rx="5"/>
        <path d="M12 68 L38 32 L58 58 L68 46 L88 68"/>
